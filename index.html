<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secondary Math Games Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        h1 { font-size: 32px; font-weight: 800; color: #10b981; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; text-decoration: none; color: white; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #10b981; }
        .card h2 { margin: 0 0 10px 0; font-size: 20px; color: #38bdf8; }
        .card p { margin: 0; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Secondary Math Games</h1>
        <p>Interactive LaTeX & JSXGraph Diagnostic Tools</p>
        
        <div class="grid">
            <a href="errors_in_measurement.html" class="card">
                <h2>Measurement Master PRO</h2>
                <p>Absolute error, limits, relative error, percentage error, and visual scale analysis.</p>
            </a>
            <!-- Add future games here as new cards -->
        </div>
    </div>
</body>
</html>
